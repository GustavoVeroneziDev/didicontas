name: Deploy Automático para Hospedagem (FTP)

# Controla quando a Action vai rodar
on:
  # Dispara o deploy sempre que houver um push na branch "main"
  push:
    branches: [ "main" ]

  # Permite que você rode essa Action manualmente na aba "Actions"
  workflow_dispatch:

jobs:
  # CI: php -l (PHP 8.2, a mesma da hospedagem) em todo .php do repositório. Todo job de deploy tem
  # `needs: verificar` — com um erro de sintaxe, nada sobe (base: biblioteca-pessoal/.github/workflows/deploy.template.yml).
  verificar:
    name: Verificar PHP (php -l)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2 (a mesma versão da hospedagem)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l em todo .php — um erro de sintaxe trava o deploy
        run: |
          erros=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /tmp/lint.txt 2>&1 || { erros=$((erros+1)); cat /tmp/lint.txt; }
          done < <(git ls-files -z '*.php')
          echo "Arquivos .php com erro de sintaxe: $erros"
          [ "$erros" -eq 0 ]

  deploy:
    needs: verificar
    name: 🚀 Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do repositório (baixa os arquivos para o runner)
      - name: 🚚 Obtendo os arquivos do repositório
        uses: actions/checkout@v4

      # 2. Sincroniza os arquivos com a sua hospedagem via FTP
      - name: 📂 Sincronizando com o Servidor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Altere para a pasta raiz do seu site no servidor (ex: /public_html/ ou /public_html/didicontas/)
          server-dir: ./
          # Opcional: Ignora pastas que não precisam ir para o servidor
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md